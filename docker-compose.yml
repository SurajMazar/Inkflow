# Inkflow local stack. Works with `podman compose` (podman-compose) and `docker compose`.
#   Infrastructure only (for `pnpm dev`):   podman compose up -d
#   Full containerized stack:              podman compose --profile app up -d --build
name: inkflow

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: inkflow
      POSTGRES_PASSWORD: inkflow
      POSTGRES_DB: inkflow
    ports:
      - '${INKFLOW_POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inkflow -d inkflow']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1000']
    ports:
      - '${INKFLOW_REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: inkflow
      MINIO_ROOT_PASSWORD: inkflow-dev-secret
    ports:
      - '${INKFLOW_MINIO_PORT:-9000}:9000'
      - '${INKFLOW_MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 inkflow inkflow-dev-secret &&
      mc mb --ignore-existing local/inkflow &&
      mc anonymous set none local/inkflow &&
      echo 'bucket ready'
      "
    restart: 'no'

  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - '${INKFLOW_SMTP_PORT:-1026}:1025'
      - '${INKFLOW_MAILPIT_UI_PORT:-8026}:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    restart: unless-stopped

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # The container stack is configured here, independent of the host `.env` used by `pnpm dev`.
    # Override the secrets for anything beyond local testing (see DEPLOYMENT.md).
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://inkflow:inkflow@postgres:5432/inkflow?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: inkflow
      S3_ACCESS_KEY: inkflow
      S3_SECRET_KEY: inkflow-dev-secret
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      WEB_ORIGIN: http://localhost:${INKFLOW_WEB_PORT:-8190}
      PUBLIC_API_URL: http://localhost:${INKFLOW_WEB_PORT:-8190}/api
      JWT_SECRET: ${INKFLOW_JWT_SECRET:-local-container-jwt-secret-7f3a9c2e5b8d1f4a6c0e}
      SESSION_SECRET: ${INKFLOW_SESSION_SECRET:-local-container-session-secret-2b6e9d4f1a8c3e7b0d5f}
      TRUST_PROXY: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${INKFLOW_WEB_PORT:-8190}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
