apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: inkflow-cert
spec:
  domains: [inkflow.example.com]
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: inkflow-frontend
spec:
  redirectToHttps:
    enabled: true
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: inkflow-api
spec:
  # The GCE load balancer closes connections after timeoutSec, WebSockets included.
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 30
  healthCheck:
    type: HTTP
    requestPath: /api/health/ready
    port: 4000
