apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: inkflow-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: inkflow-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inkflow-api
    spec:
      serviceAccountName: inkflow-api
      # WebSocket clients reconnect to another pod; give in-flight requests time to finish.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: inkflow-api
      containers:
        - name: api
          image: inkflow-api
          ports:
            - name: http
              containerPort: 4000
          env:
            # Migrations run in the inkflow-migrate Job, not on every pod start.
            - name: SKIP_MIGRATIONS
              value: 'true'
          envFrom:
            - configMapRef:
                name: inkflow-config
            - secretRef:
                name: inkflow-secrets
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            # Let the load balancer stop routing before the process receives SIGTERM.
            preStop:
              exec: { command: ['sleep', '10'] }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ['ALL'] }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: inkflow-api
spec:
  selector:
    app.kubernetes.io/name: inkflow-api
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inkflow-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
  behavior:
    scaleDown:
      # Scale down slowly: each removed pod disconnects its WebSocket clients.
      stabilizationWindowSeconds: 300
      policies:
        - { type: Pods, value: 1, periodSeconds: 120 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inkflow-api
