# Inkflow web — static SPA + reverse proxy for the API (HTTP and WebSocket).
# Installed as /etc/nginx/conf.d/inkflow.conf inside the nginx:alpine image.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Cache policy by path: hashed build assets are immutable, the HTML shell is always revalidated.
map $uri $inkflow_cache_control {
  ~^/assets/                                                   "public, max-age=31536000, immutable";
  ~^/(favicon\.svg|manifest\.webmanifest|robots\.txt)$         "public, max-age=86400";
  /theme-init.js                                               "public, max-age=3600";
  default                                                      "no-cache";
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 25m;
  charset utf-8;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml;

  # Security headers (inherited by every location that doesn't declare its own add_header).
  add_header Cache-Control $inkflow_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; media-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Liveness probe for the container.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # API + collaboration WebSocket (/api/ws) → NestJS backend.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;
    # Declaring add_header here stops inheritance: API responses keep their own headers.
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Hashed assets: never fall back to index.html (a missing chunk must 404).
  location /assets/ {
    try_files $uri =404;
    access_log off;
  }

  # SPA: unknown paths render the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
