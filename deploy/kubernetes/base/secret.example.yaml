# Example only; NOT included in kustomization.yaml. Create the real Secret out of band, e.g.:
#
#   kubectl -n inkflow create secret generic inkflow-secrets \
#     --from-literal=DATABASE_URL='postgresql://inkflow:***@db-host:5432/inkflow?sslmode=require' \
#     --from-literal=REDIS_URL='rediss://:***@redis-host:6379' \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=SESSION_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=S3_ACCESS_KEY='***' --from-literal=S3_SECRET_KEY='***' \
#     --from-literal=SMTP_HOST='smtp.example.com' --from-literal=SMTP_USER='***' --from-literal=SMTP_PASS='***'
#
# or sync it from AWS Secrets Manager / GCP Secret Manager with the External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: inkflow-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql://inkflow:change-me@db-host:5432/inkflow?sslmode=require
  REDIS_URL: rediss://:change-me@redis-host:6379
  JWT_SECRET: replace-with-openssl-rand-base64-48
  SESSION_SECRET: replace-with-openssl-rand-base64-48
  S3_ENDPOINT: ''
  S3_ACCESS_KEY: change-me
  S3_SECRET_KEY: change-me
  SMTP_HOST: smtp.example.com
  SMTP_USER: change-me
  SMTP_PASS: change-me
  GOOGLE_CLIENT_ID: ''
  GOOGLE_CLIENT_SECRET: ''
  GITHUB_CLIENT_ID: ''
  GITHUB_CLIENT_SECRET: ''
